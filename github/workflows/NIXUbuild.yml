name: Build APK from zip
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip newest source zip
        run: |
          set -e
          Z=$(ls FastDialer*.zip | sort -V | tail -n1)
          echo "Using $Z"
          mkdir -p work
          unzip -q -o "$Z" -d work
          D=$(dirname "$(find work -name settings.gradle.kts | head -n1)")
          echo "Project folder: $D"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FastDialer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
